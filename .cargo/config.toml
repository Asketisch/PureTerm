# PureTerm Cargo 配置
# 为 macOS ARM64(Apple Silicon)+ Linux CI 构建优化。
#
# 关于链接器:
#   - macOS 15+/Xcode 16+ 自带新的默认链接器(ld-prime),已经
#     很快。旧的 `zld` 无人维护且与当前工具链不兼容,
#     因此 macOS 上*有意*不覆盖链接器。
#   - Linux 上保留 mold/lld,CI 链接时间大幅缩短。
#     链接器缺失时 Rust 回退到系统 `ld`。

[build]
incremental = true
# sccache:跨构建、跨 crate 透明缓存 rustc 调用输出。
# 注意:此处*有意*不设置 `rustc-wrapper = "sccache"`——
# 该配置在 sccache 不在 PATH 时是硬错误(不会回退),
# 会让新克隆/未装 sccache 的机器直接构建失败。想启用
# sccache 请用环境变量(缺失时 cargo 不受影响):
#   export RUSTC_WRAPPER=sccache
# (需先 `cargo install sccache --locked` 或 `brew install sccache`)。

# ── Linux x86_64 CI:mold 最快,lld 是不错的兜底 ────────────────
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

# ── Linux ARM64 架构:lld ────────────────────────────────────────────────────────
[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]
