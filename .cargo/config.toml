# PureTerm Cargo Configuration
# Optimized for macOS ARM64 (Apple Silicon) + Linux CI builds.
#
# Note on linkers:
#   - macOS 15+/Xcode 16+ ship a new default linker (ld-prime) that is already
#     very fast. The old `zld` is unmaintained and incompatible with current
#     toolchains, so we intentionally do NOT override the linker on macOS.
#   - On Linux we keep mold/lld, which give large link-time wins in CI.
#     If the linker is absent, Rust falls back to the system `ld`.

[build]
incremental = true
# sccache: transparently caches rustc invocation outputs across builds and
# across crates. When sccache is missing on PATH, cargo falls back to invoking
# rustc directly — no hard error, so fresh checkouts and CI runners without
# sccache still work. Install with `cargo install sccache --locked` (or
# `brew install sccache` on macOS) for the speedup.
rustc-wrapper = "sccache"

# ── Linux x86_64 CI: mold is fastest, lld is a good fallback ────────────────
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

# ── Linux ARM64: lld ────────────────────────────────────────────────────────
[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]
