# PureTerm 示例配置文件
# 放置于 ~/.config/pureterm/alacritty.toml

[env]
TERM = "xterm-256color"

[window]
dimensions = { columns = 120, lines = 36 }
# GAP-73/74:标题栏样式:
#   overlay = 红绿灯融入界面顶栏(仅 macOS 有效,macOS 默认)
#   native  = 系统原生标题栏(Windows 上会被染成主题色)
#   unified = 应用自绘标题栏(跨平台;Linux 上获得同款观感的唯一途径)
titlebar = "overlay"
padding = { x = 6, y = 6 }
decorations = "Full"
startup_mode = "Windowed"
opacity = 1.0
dynamic_title = true

[scrolling]
history = 10000
multiplier = 3

[font]
normal = { family = "JetBrains Mono", style = "Regular" }
bold = { family = "JetBrains Mono", style = "Bold" }
italic = { family = "JetBrains Mono", style = "Italic" }
size = 14.0
offset = { y = 0 }

[cursor]
style = { shape = "Block", blinking = "On" }
vi_mode_style = { shape = "Block", blinking = "Off" }
unfocused_hollow = true

[mouse]
hide_when_typing = true

[selection]
save_to_clipboard = true

# GAP-72:界面外观预设。
# classic   = 经典深色(默认,行为与旧版完全一致)
# cyberpunk = 霓虹赛博朋克(外壳 + 终端 ANSI 16 色 + 终端主色)
# terminal_palette: follow(默认,跟随 preset) | user(保留自己的 [colors.*])
[appearance]
preset = "classic"
terminal_palette = "follow"

[colors.primary]
background = "#1e1e2e"
foreground = "#cdd6f4"

[colors.normal]
black = "#45475a"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#bac2de"

[colors.bright]
black = "#585b70"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#a6adc8"

[[keyboard.bindings]]
key = "V"
mods = "Control|Shift"
action = "Paste"

[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
action = "Copy"

[[keyboard.bindings]]
key = "N"
mods = "Control|Shift"
action = "SpawnNewInstance"

[[keyboard.bindings]]
key = "F11"
action = "ToggleFullscreen"

[[keyboard.bindings]]
key = "Plus"
mods = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Minus"
mods = "Control"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "Key0"
mods = "Control"
action = "ResetFontSize"
