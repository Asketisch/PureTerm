# 示例插件 1:CPU 状态栏组件。
#
# 本插件注册 `StatusBarComponent` Provides 能力。宿主
# 在每次状态栏刷新 tick 时调用插件的 `render` 导出;
# 插件返回 JSON 组件描述,由宿主翻译为
# iced 组件。
#
# 构建(需要 `wasm32-wasip1` target + `wasm-runtime` feature):
#   cd examples/plugins/cpu-status
#   cargo build --release --target wasm32-wasip1
#   cp ../../../target/wasm32-wasip1/release/cpu_status.wasm .
#
# 安装:
#   pureterm plugin install ./cpu_status.wasm

[plugin]
name = "cpu-status"
version = "0.1.0"
description = "CPU usage monitor for the PureTerm status bar."
author = "PureTerm"
abi_version = 1

[plugin.provides]
status_bar_component = "render"

[plugin.config_schema]
# 可选:声明插件读取的配置键。宿主在实例化插件前
# 会用此 schema 校验用户的 `[[plugins.config]]` 块,
# 校验通过才实例化。
refresh_interval_ms = { type = "integer", default = 1000, min = 100, max = 60000 }
color = { type = "string", default = "#58c4dc" }