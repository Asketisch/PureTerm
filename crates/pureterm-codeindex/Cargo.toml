[package]
name = "pureterm-codeindex"
version = "0.2.0"
edition = "2021"
description = "GAP-03: Tree-sitter codebase chunking + SQLite keyword search for PureTerm MCP"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tree-sitter = "0.24"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
