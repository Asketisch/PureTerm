[package]
name = "pureterm-daemon"
version = "0.2.1"
edition = "2021"
description = "puretermd — persistent PTY daemon so terminal/SSH sessions survive GUI close (GAP-5.1)"

[lib]
name = "pureterm_daemon"
path = "src/lib.rs"

[[bin]]
name = "puretermd"
path = "src/bin/puretermd.rs"

[dependencies]
pureterm-jsonrpc = { workspace = true }
pureterm-ssh = { workspace = true }
alacritty_terminal = { path = "../alacritty_terminal" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process"] }
polling = "3"
libc = "0.2"
log = "0.4"
dirs = "6.0"
env_logger = "0.11"
# GAP-5.2:SOCKS5 隧道的进程内 SSH 客户端。默认
# aws-lc-rs 加密后端,它已在本工作区
# `target/` 构建过(无需新的原生构建)。russh-keys 已在 0.50 并入 `russh::keys`,
# 故无单独 crate。SOCKS5 手写(无 fast-socks5 依赖)。
russh = "0.60"
# GAP-5.2:tunnels.json 持久化的原子写入(tempfile + rename)。
tempfile = "3"

[dev-dependencies]
