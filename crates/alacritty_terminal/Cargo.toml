[package]
name = "alacritty_terminal"
version = "0.26.1-dev"
authors = ["Christian Duerr <contact@christianduerr.com>", "Joe Wilm <joe@jwilm.com>"]
license = "Apache-2.0"
description = "Library for writing terminal emulators"
readme = "../README.md"
homepage = "https://alacritty.org"
repository = "https://github.com/alacritty/alacritty"
edition = "2024"
rust-version = "1.85.0"

[features]
default = ["serde"]
serde = ["dep:serde", "bitflags/serde", "vte/serde"]

[dependencies]
base64 = "0.22.0"
bitflags = "2.4.1"
home = "0.5.5"
libc = "0.2"
log = "0.4"
memchr = "2"
parking_lot = "0.12.0"
polling = "3.8.0"
regex = "1"
regex-automata = "0.4.3"
unicode-width = "0.2.0"
smallvec = "1"
vte = { version = "0.15.0", default-features = false, features = ["std", "ansi"] }
serde = { version = "1", features = ["derive", "rc"], optional = true }

[target.'cfg(unix)'.dependencies]
rustix-openpty = "0.2.0"
rustix = { version = "1.0.0", default-features = false, features = ["std"] }
signal-hook = "0.4.3"

[target.'cfg(windows)'.dependencies]
piper = "0.2.1"
miow = "0.6.0"
windows-sys = { version = "0.59.0", features = [
    "Win32_System_Console",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
]}

[dev-dependencies]
# 参考网格以 gzip 入库，测试运行时解压
flate2 = "1.1"
serde_json = "1.0.0"

# vendored 上游源码不做无关改动;新版 clippy 对上游既有代码的
# 两个风格 lint 在此 crate 级放行,保证 `clippy -- -D warnings`
# 全绿(上游 alacritty 仓库自身同样依赖各自版本的 lint 容忍)。
[lints]
clippy.type_complexity = "allow"
clippy.missing_safety_doc = "allow"
