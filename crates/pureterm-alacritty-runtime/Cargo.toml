[package]
name = "pureterm-alacritty-runtime"
version = "0.1.0"
edition = "2024"
description = "PureTerm - GPU glyph atlas runtime"

[dependencies]
# glyph_atlas 实际需要的依赖
crossfont = "0.8.1"
indexmap = { version = "2", features = ["std"] }

# t-core-shaper: Harfbuzz via rustybuzz (UAX #29 + complex script shaping)
rustybuzz = "0.20"
unicode-bidi = "0.3"
unicode-script = "0.5"

# PureTerm v0.2: `build.rs` only references `embed_resource` inside a
# `#[cfg(windows)]` block gated on a missing `.rc` file, so it never
# actually fires today. Declaring the dep here (gated to Windows) keeps
# the build green the moment a real `.rc` is dropped in — otherwise the
# unconditional reference would fail to resolve and break `cargo build`
# for the workspace.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"
