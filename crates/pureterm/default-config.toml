# PureTerm default configuration
# Full documentation: https://github.com/user/pureterm

[env]
TERM = "xterm-256color"

[window]
padding = { x = 2, y = 0 }
dynamic_title = true

[scrolling]
history = 10000
multiplier = 3

[cursor]
style = { shape = "Block", blinking = "Off" }
unfocused_hollow = true

[selection]
save_to_clipboard = false

[mouse]
hide_when_typing = false

# GAP-24: Enhanced Status Bar. `components` is the ordered list of segments;
# chips are grouped visually into 4 clusters (Context / Runtime / System /
# Meta). The Context / Runtime / System groups render left-to-right in the
# order they appear in `components`; Meta (cursor + clock) and the ⌘K
# entry point sit on the right edge separated by a flexible spacer. Hidden
# when a segment is absent (e.g. battery on a desktop). Unknown ids are
# skipped with a one-time warning.
#
# Recognized ids: cwd, git, ssh, vimode, process, agent, cpu, memory,
# network, clock, battery, cursor, notifications, trigger_count, codeindex,
# lsp. `notifications` is on by default; the others need to be added to
# `components` to show up.
#
# `refresh_interval_secs` bounds system-stat sampling + git subprocess
# cadence. `show_sparklines` toggles the canvas mini-graphs (cpu/memory/
# network); when on, the bar auto-grows to ≥28px for legibility
# (`bar_height` is the floor). `clock_format` is a chrono format string
# passed straight to `chrono::Local::now().format(...)`; the default
# `%H:%M:%S` shows hours/minutes/seconds. `clock_show_seconds = false`
# strips any `%S` / `%s` token from the format on the fly, so the same
# format string reads cleanly whether seconds are on or off.
#
# Misc: the git segment no longer uses Nerd Font Private-Use-Area glyphs
# (the old `\u{e0a0}` branch icon replaced with `[br] <name>`), so the bar
# stays readable on systems without Nerd Fonts installed.
[statusbar]
components = ["cwd", "git", "ssh", "vimode", "process", "agent", "cpu", "memory", "network", "clock", "battery", "cursor", "notifications"]
refresh_interval_secs = 1
show_sparklines = true
bar_height = 24
clock_format = "%H:%M:%S"
clock_show_seconds = true

# GAP-19: Dual Sidebar — ⌘B left (Workspaces + Git summary), ⌘⇧B right
# (Find / Feed / Git tabs). Widths in px, clamped to 120–480.
[sidebar]
left_width = 240
right_width = 240
# left_default_open = false

# GAP-35: LSP client (rust-analyzer MVP). Opt-in — set `enabled = true` when
# `rust-analyzer` is on PATH. Diagnostics surface in the status bar (`lsp`
# segment) and AI Chat context after opening a `.rs` file via hover preview.
[lsp]
enabled = false

[lsp.servers]
rust = "rust-analyzer"

# section controls the Git sidebar tab and the `gh` PR subprocess.
[git]
panel_enabled = true       # Git tab in the right sidebar (legacy ⌘⇧B alias)
show_pr = true             # query the linked PR via `gh` (needs `gh auth`)
pr_refresh_ticks = 30      # PR refresh cadence in status-bar ticks (~30s)
# lazygit_cmd = "lazygit"  # override the lazygit binary name for the panel button

# GAP-09: Notification System — OSC 9/99/777 + bell → per-pane attention ring,
# status-bar unread count (🔔 above), Dock badge, and macOS desktop toasts.
[notification]
enabled = true                # master switch (false ⇒ no ring/badge/toast/audit)
desktop_notifications = true  # macOS toast (UNUserNotificationCenter; needs bundle id)
dock_badge = true             # unread count on the app icon
ring = true                   # amber attention ring around the pane
bell_passthrough = true       # surface BEL (0x07) as an attention signal
bell_throttle_ms = 1000       # ≤1 bell-derived notif per pane per this window

# GAP-10: Triggers — regex on terminal *output* → highlight / notify / send_text / exec /
# set_variable / set_mark / fold. Templates: {match}, $1–$9, ${var:NAME}, \n\r\t\xNN.
# Uncomment and customize (never commit real passwords in send_text):
#
# Security: when a match originates from an SSH/remote pane, `exec` and
# cross-pane `send_text` are BLOCKED by default — remote-controlled text must
# not drive local code execution / keystroke injection. Opt in (top-level,
# NOT under [triggers] which is an array):
#   allow_exec_on_remote = true
# Same-pane `send_text` (e.g. sudo auto-reply) is never blocked.
#
# [[triggers]]
# name = "error-spot"
# pattern = "(?i)error:"
# action = "highlight"
#
# [[triggers]]
# name = "build-done"
# pattern = "Built in \\d+s"
# action = "notify"
# title = "Build complete"
#
# [[triggers]]
# name = "mark-build"
# pattern = "^Building"
# action = "set_mark"
# mark = "build_start"
#
# [[triggers]]
# name = "fold-build"
# pattern = "SUCCESS"
# action = "fold"
# mark = "build_start"
#
# GAP-02: Error Recovery — auto LLM fix suggestions on non-zero exit (needs Shell Integration).
[error_recovery]
enabled = true
auto_analyze = true
provider = "anthropic"
# model = "claude-3-5-sonnet-latest"
# max_output_lines = 80
# max_tokens = 1024
# api_key_env = "ANTHROPIC_API_KEY"
# openai_base_url = "https://api.openai.com/v1"
#
# GAP-33: Port Scanner — right sidebar "Ports" tab lists listening TCP ports
# (via `lsof`, refreshed every N seconds). Click row copies localhost:PORT; ↗
# opens http://localhost:PORT in the browser. Ports below min_port are hidden.
[port_scanner]
enabled = true
interval = 5
min_port = 1024

# GAP-36: Semantic History — ⌘-click file:line in terminal output opens the
# file in your editor. `$EDITOR` overrides `editor` below; default is VS Code.
[semantic_history]
enabled = true
editor = "code"

# GAP-01: AI Chat Panel — ⌘⇧L toggles the right-docked chat overlay (⌘L is Browser).
[ai_chat]
provider = "anthropic"
# model = "claude-3-5-sonnet-latest"
# max_tokens = 4096
# api_key_env = "ANTHROPIC_API_KEY"
# openai_base_url = "https://api.openai.com/v1"
#
# GAP-07: Soul System — personality files in ~/.config/pureterm/ai/
# (SOUL.md, STYLE.md, SKILL.md, MEMORY.md) injected into AI Chat system prompt.
[soul]
enabled = true
# directory = "/custom/path/to/ai"
#
# GAP-08: Natural language commands — type `# find large files` + Enter to
# generate a shell command (shared LLM provider with `[ai_chat]`).
[natural_language]
enabled = true
# max_tokens = 512
#
# GAP-47: AppleScript bridge MVP — external scripts call `pureterm script …`
# (e.g. via `osascript` → `do shell script`). Full NSAppleEventManager deferred.
[applescript]
enabled = true
#
# GAP-48: pureterm:// URL scheme — macOS Info.plist CFBundleURLTypes + handler.
# Set register_on_launch = true to call LSSetDefaultHandlerForURLScheme at startup.
[url_scheme]
enabled = true
register_on_launch = false
#
# GAP-40 / GAP-5.3 / GAP-37: SSH global knobs (per-profile forwards in [[ssh.profiles]]).
[ssh]
smallest_screen_wins = true
password_manager = "auto"   # auto | keychain | 1password | lastpass
# [[ssh.profiles]]
# name = "dev"
# host = "example.com"
# jump_hosts = ["bastion.example.com"]
# login_commands = ["cd /app", "docker ps"]
# session_type = "ssh"      # ssh | telnet | serial
# local_forwards = ["8080:localhost:80"]
# remote_forwards = ["9000:127.0.0.1:22"]
# forward_x11 = false
#
# Status bar: add "trigger_count" to [statusbar] components for ⚡ N hit counter.
#
# GAP-51: Block-based output scaffold (off by default). When enabled, each OSC
# 133 D mark appends OutputBlock + `block.finished`; open right sidebar Blocks
# tab for list/filter/jump. Grid slicing / sum-tree viewport still deferred.
[block_output]
enabled = false
#
# ── P3 GAP MVPs (2026-06-29) ─────────────────────────────────────────────
#
# GAP-06: Ambient Agents — local task queue (cloud/SSE deferred).
[ambient_agents]
enabled = false
poll_interval_secs = 30
#
# GAP-13: Broadcast keyboard input to sibling panes (⌘⌃B).
[broadcast_input]
enabled = true
#
# GAP-18: BiDi text mode for RTL scripts.
[terminal]
bidi_mode = "auto"   # auto | ltr | rtl
#
# GAP-26: Workspace sidebar groups.
# [[workspace_groups]]
# name = "Work"
# workspaces = ["dev", "staging"]
#
# GAP-30: Toolbelt right-sidebar tab (⌘⇧T).
[toolbelt]
enabled = true
tools = ["history", "directories", "snippets", "paste_history"]
#
# GAP-31: Quake-style dock (F12 default; enable to use).
[quake]
enabled = false
height_fraction = 0.45
#
# GAP-46: UI locale (Settings + main app via pureterm-settings I18n).
[pureterm]
locale = "en"
#
# ── P4 GAP MVPs (disabled by default unless noted) ────────────────────────
#
# GAP-05: Voice input (Whisper API URL required when enabled).
[voice_input]
enabled = false
# api_url = "https://api.openai.com/v1/audio/transcriptions"
#
# GAP-17: Sixel / chunked inline graphics.
[terminal_graphics]
enabled = false
max_images = 64
# T-core-closure: per-image byte cap. 32 MiB matches the default in
# `TerminalGraphicsConfig`; raise to 256 MiB for high-res screenshots, lower
# to 4 MiB to keep memory tight on shared hosts.
max_image_bytes = 33554432

# T-core-shaper v2: Harfbuzz via rustybuzz + per-script fallback chain.
# Set `backend = "rustybuzz"` and provide a primary font blob (or rely on
# the per-fallback-entry path) for true complex-script shaping (Arabic
# final-form, Devanagari reph, emoji ZWJ sequences). The default
# `monospace` shaper is the v1 pure-Rust cluster shaper — it correctly
# handles Latin / CJK width but doesn't shape complex scripts.
[shaper]
backend = "monospace"
language = "en-US"
enable_features = true

# Per-script fallback font chain. The first entry is the primary monospace
# font; subsequent entries are tried in order for characters the primary
# font doesn't cover. `path = ""` is allowed (the loader falls back to
# the platform's system font lookup).
fallback_chain = [
    { name = "Monospace", path = "", script = "monospace" },
    { name = "CJK JP",    path = "", script = "cjk-jp" },
    { name = "CJK KR",    path = "", script = "cjk-kr" },
    { name = "CJK SC",    path = "", script = "cjk-sc" },
    { name = "Emoji",     path = "", script = "emoji" },
    { name = "Serif",     path = "", script = "serif" },
]
#
# GAP-20 / GAP-55: Window glass + opacity/blur (`[window]` nested tables).
[window]
# [window.glass]
# enabled = false
# style = "vibrancy"
# [window.border]
# enabled = false
# width = 2.0
# active_color = "#007AFF"
# [window.effects]
# enabled = false
# opacity = 0.92
# blur = false
#
# GAP-22: Touch Bar (macOS).
[touch_bar]
enabled = false
#
# GAP-23: Visual tab bar.
[tab_bar]
enabled = true
position = "top"
height = 28.0
#
# GAP-29: Environment badge overlay.
[badge]
enabled = false
# text = "DEV"
# color = "#FF3B30"
# position = "bottom-right"
#
# GAP-34: File preview on path selection.
[file_preview]
enabled = true
#
# GAP-38: SCP/SFTP transfers.
[file_transfer]
enabled = false
#
# GAP-44: Shared sessions (stub).
[shared_session]
enabled = false
port = 8765
#
# GAP-45: Auto-update.
[update]
enabled = false
auto_check = false
channel = "stable"
#
# GAP-49: Plugins.
[plugins]
enabled = false
#
# GAP-50: Cloud sync (local bundle MVP).
[cloud_sync]
enabled = false
#
# GAP-52: Workflows (`[[workflows]]` entries).
[workflows]
enabled = true
#
# GAP-53: Notebooks.
[notebooks]
enabled = false
#
# GAP-54: Background image.
[background]
enabled = false
# image = "/path/to/wallpaper.png"
# opacity = 0.35
# mode = "center"
#
# GAP-56: Focus follows mouse (split panes).
[focus_follows_mouse]
enabled = false
delay_ms = 150
#
# GAP-57: Haptic feedback (macOS).
[haptic]
enabled = false
#
# GAP-58: Extended theme colors.
[theme]
enabled = false
follow_system = false
#
# GAP-59: Emoji rendering.
[emoji]
enabled = true
dedicated_atlas = false
#
# GAP-60: Pane capture export.
[pane_capture]
enabled = true
default_format = "txt"
#
# GAP-61: Print support.
[print]
enabled = false
#
# GAP-4.6: Accessibility / VoiceOver announcements.
[accessibility]
enabled = true
announce_tab_changes = true
