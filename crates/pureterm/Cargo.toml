[package]
name = "pureterm"
version = "0.1.0"
edition = "2021"
description = "PureTerm - Alacritty-based terminal emulator"

[dependencies]
pureterm-alacritty-runtime = { workspace = true }
pureterm-settings = { path = "../pureterm-settings" }
pureterm-jsonrpc = { workspace = true }
pureterm-daemon = { path = "../pureterm-daemon" }
pureterm-ssh = { workspace = true }
alacritty_terminal = { path = "../alacritty_terminal" }
dirs = "6.0.0"
iced = { version = "0.14", features = ["advanced", "canvas", "tokio"] }
# GAP-7.1: agent-hook matcher / deny_pattern regex evaluation.
regex = "1"
iced_wgpu = "0.14"
wgpu = { version = "27", features = ["webgpu"] }
bytemuck = { version = "1", features = ["derive"] }
crossbeam-channel = "0.5"
crossfont = "0.8.1"
notify = "8.0.0"
tokio = { version = "1", features = ["sync", "time", "net", "io-util"] }
env_logger = "0.11"
log = "0.4"
parking_lot = "0.12"
arboard = "3"

# SSH backend dependencies (Unix-only child side; AES/Argon2/serde cross-platform)
alacritty_config_derive = { path = "../alacritty_config_derive" }
alacritty_config = { path = "../alacritty_config" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# GAP-6.2: structured CLI command groups (clap derive, mirroring pureterm-settings).
clap = { version = "4", features = ["derive"] }
toml = "0.9"
# PureTerm: format-preserving TOML writer; the main process now reuses
# `pureterm_settings::config_io::mutate_config` to persist SSH profiles
# through `toml_edit` instead of a string state machine. Direct
# `toml_edit::{Item, Table, ArrayOfTables}` references in iced_app.rs
# need this dep listed here, not transitively.
toml_edit = "0.22"
nucleo-matcher = "0.3"
# GAP-7.2: agent adapter installer — locked read-modify-write of
# ~/.claude/settings.json (fs2 advisory lock + atomic NamedTempFile::persist).
fs2 = "0.4"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
polling = "3"
signal-hook = "0.3"
aes-gcm = "0.10"
argon2 = "0.5"
zeroize = { version = "1", features = ["zeroize_derive"] }
rand = "0.8"
rustix-openpty = "0.2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.1"
# PureTerm: screen eyedropper (NSColorSampler) 需要 block2 (0.6，与 objc2-app-kit 0.3.2 一致) 做 ObjC block。
block2 = "0.6"
objc2-foundation = { version = "0.3.1", default-features = false, features = ["std", "NSArray", "NSString"] }
objc2-app-kit = { version = "0.3.1", default-features = false, features = [
    "std", "NSApplication", "NSResponder", "NSView", "NSWindow", "NSMenu", "NSMenuItem",
    "objc2-quartz-core",
    # PureTerm: 屏幕吸管 NSColorSampler + sRGB 分量读取。
    "NSColorSampler", "NSColor", "NSColorSpace", "block2", "objc2-core-foundation",
] }
objc2-quartz-core = { version = "0.3.1", default-features = false, features = [
    "std", "CALayer", "CAMetalLayer", "objc2-metal",
] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
xdg = "3.0.0"