[package]
name = "pureterm"
version = "0.1.0"
edition = "2021"
description = "PureTerm - Alacritty-based terminal emulator"

[features]
# GAP-7.10: MCP stdio server (`pureterm mcp serve`). Default-on so the shipped
# binary exposes the terminal surface to AI agents out of the box; build with
# `--no-default-features` to drop rmcp and the tokio runtime bits.
default = ["mcp-server"]
mcp-server = [
    "dep:rmcp",
    "dep:rmcp-macros",
    "tokio/io-std",
    "tokio/rt",
    "tokio/rt-multi-thread",
]

[dependencies]
pureterm-alacritty-runtime = { workspace = true }
pureterm-settings = { path = "../pureterm-settings" }
pureterm-jsonrpc = { workspace = true }
pureterm-daemon = { path = "../pureterm-daemon" }
pureterm-ssh = { workspace = true }
pureterm-codeindex = { workspace = true }
pureterm-lsp = { workspace = true }
pureterm-computer-use = { workspace = true }
alacritty_terminal = { path = "../alacritty_terminal" }
dirs = "6.0.0"
iced = { version = "0.14", features = ["advanced", "canvas", "tokio"] }
# GAP-7.1: agent-hook matcher / deny_pattern regex evaluation.
regex = "1"
iced_wgpu = "0.14"
wgpu = { version = "27", features = ["webgpu"] }
bytemuck = { version = "1", features = ["derive"] }
crossbeam-channel = "0.5"
crossfont = "0.8.1"
notify = "8.0.0"
# GAP-01 AI Chat: LLM HTTP client. rustls-tls avoids pulling OpenSSL on Linux
# (keeps the wry/rustls TLS stack uniform); `stream` exposes
# `Response::bytes_stream()` to feed the SSE decoder. default-features=false
# drops native-tls + the http2/macos bits we don't need.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
# GAP-4.2: Hover Preview — gitignore-aware path metadata checks.
ignore = "0.4"
tokio = { version = "1", features = ["sync", "time", "net", "io-util", "process", "macros"] }
# GAP-24 Enhanced Status Bar: system metrics (CPU/Memory/Network), battery,
# and local-time clock formatting for the new status-bar segments.
sysinfo = "0.32"
battery = "0.7"
chrono = "0.4"
env_logger = "0.11"
log = "0.4"
parking_lot = "0.12"
arboard = "3"

# SSH backend dependencies (Unix-only child side; AES/Argon2/serde cross-platform)
alacritty_config_derive = { path = "../alacritty_config_derive" }
alacritty_config = { path = "../alacritty_config" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# GAP-6.2: structured CLI command groups (clap derive, mirroring pureterm-settings).
clap = { version = "4", features = ["derive"] }
toml = "0.9"
# PureTerm: format-preserving TOML writer; the main process now reuses
# `pureterm_settings::config_io::mutate_config` to persist SSH profiles
# through `toml_edit` instead of a string state machine. Direct
# `toml_edit::{Item, Table, ArrayOfTables}` references in iced_app.rs
# need this dep listed here, not transitively.
toml_edit = "0.22"
unicode-bidi = "0.3"
nucleo-matcher = "0.3"
# GAP-54: terminal background image decode (PNG/JPG) -> RGBA bytes for the GPU texture.
# Only the default features (no webp/heif) — keep the dep surface small.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# GAP-01 AI Chat: Markdown → text spans for streamed assistant replies. Core
# parser only (no HTML rendering feature) — the panel maps spans to iced rich
# text; syntax highlighting (syntect) is deferred.
pulldown-cmark = { version = "0.12", default-features = false }
# GAP-7.2: agent adapter installer — locked read-modify-write of
# ~/.claude/settings.json (fs2 advisory lock + atomic NamedTempFile::persist).
fs2 = "0.4"
tempfile = "3"
# GAP-3.5/5.2/7.8: WebView embed + per-view SOCKS5 proxy. `mac-proxy` enables
# `WebViewBuilder::with_proxy_config` (Network framework SOCKS5; macOS 14+),
# the Phase C R8 mechanism that binds a web pane to an SSH tunnel. The feature
# compiles to nothing on non-macOS, so enabling it unconditionally is safe.
wry = { version = "0.55.1", features = ["mac-proxy"] }
raw-window-handle = "0.6.2"
# GAP-7.10: MCP stdio server. Optional + feature-gated (`mcp-server`). `server`
# pulls the handler + `#[tool]` macros (macros is on by default); `transport-io`
# brings the stdio transport adapter (`ServiceExt::serve(stdin, stdout)`) and,
# transitively, schemars for tool-param schemas. Pinned exactly to 1.7.0 — the
# macro API (`#[tool_router]` / `#[tool_handler]`, `Parameters<T>`) was verified
# against this release and the plan flags upstream macro drift as a risk.
rmcp = { version = "=1.7.0", optional = true, features = ["server", "transport-io", "schemars"] }
# Pin the proc-macro crate to the exact matching release: rmcp 1.7.0 only
# requires `rmcp-macros ^1.7.0`, so the resolver picks the latest (1.8.0) whose
# `#[tool]` expansion emits symbols (`schema_for_input`) absent from the 1.7.0
# runtime. Declaring the exact match here steers the whole graph to 1.7.0.
rmcp-macros = { version = "=1.7.0", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
polling = "3"
signal-hook = "0.3"
aes-gcm = "0.10"
argon2 = "0.5"
zeroize = { version = "1", features = ["zeroize_derive"] }
rand = "0.8"
rustix-openpty = "0.2"
# GAP-7.7: HMAC-SHA256 signed approval tokens for custom resume bindings.
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.1"
# PureTerm: screen eyedropper (NSColorSampler) + GAP-7.8 WKWebView snapshot 都需要
# block2 (0.6，与 objc2-app-kit 0.3.2 一致) 做 ObjC block。
block2 = "0.6"
objc2-foundation = { version = "0.3.1", default-features = false, features = [
    "std", "NSArray", "NSString", "NSURL",
    # GAP-7.8 screenshot: NSData(字节读取) + NSDictionary(空 props) + NSError(错误文案)。
    "NSData", "NSDictionary", "NSError",
] }
objc2-app-kit = { version = "0.3.1", default-features = false, features = [
    "std", "NSApplication", "NSResponder", "NSView", "NSWindow", "NSMenu", "NSMenuItem",
    "NSVisualEffectView",
    "NSHapticFeedback",
    "objc2-quartz-core",
    # PureTerm: 屏幕吸管 NSColorSampler + sRGB 分量读取。
    "NSColorSampler", "NSColor", "NSColorSpace", "block2", "objc2-core-foundation",
    # GAP-7.8 screenshot: NSImage(TIFFRepresentation) + NSBitmapImageRep(PNG 编码);
    # NSBitmapImageRep 结构体的 re-export 额外要求 NSImageRep feature。
    "NSImage", "NSBitmapImageRep", "NSImageRep",
    # GAP-09: Dock badge — NSApplication::dockTile() → NSDockTile::setBadgeLabel.
    "NSDockTile",
    # GAP-61: print - NSPrintOperation.pdfOperationWithView + runOperation modal
    # dialog; NSPrintInfo drives the page rect; NSGraphicsContext needed for
    # view lockFocus(). NSStringDrawing lets us draw monospace lines into the
    # offscreen view that becomes the print job's contents.
    "NSPrintOperation", "NSPrintInfo", "NSPrintPanel",
    "NSGraphicsContext", "NSStringDrawing",
    # GAP-4.6: VoiceOver announcements via NSAccessibilityPostNotification /
    # NSAccessibilityPostNotificationWithUserInfo (used to send
    # AnnouncementRequestedNotification with NSAccessibilityAnnouncementKey).
    "NSAccessibilityConstants",
] }
objc2-quartz-core = { version = "0.3.1", default-features = false, features = [
    "std", "CALayer", "CAMetalLayer", "objc2-metal",
] }
# GAP-7.8: 原生 WKWebView 快照。wry 0.55.1 的 `WryWebView` 是 `WKWebView` 子类,
# 经 `WebViewExtMacOS::webview()` 拿到 `Retained<WryWebView>` 后调
# `takeSnapshotWithConfiguration:completionHandler:` 做快照(替代之前 "wry 未暴露"
# 的 stub)。WKWebView 传递启用 objc2-foundation 的 NSData/NSDictionary/NSError/
# objc2-core-foundation;WKSnapshotConfiguration+block2 解锁 takeSnapshot 方法;
# objc2-app-kit 让 completion block 能引用 NSImage。
objc2-web-kit = { version = "0.3.2", default-features = false, features = [
    "std", "WKWebView", "WKSnapshotConfiguration", "block2", "objc2-app-kit",
] }
# GAP-09: macOS desktop notifications — UNUserNotificationCenter toasts for
# OSC 9/99/777 + bell + `pureterm notify`. Pinned to 0.3.x (NOT 0.2.x) because
# 0.2.x is bound to objc2 0.5 / objc2-foundation 0.2, whose `NSString`/`Retained`
# are *different types* from this crate's objc2 0.6 / objc2-foundation 0.3 line
# (wry pulls 0.2.2 transitively; we deliberately add the 0.3 line as a direct
# dep so the types unify). `block2` unlocks the request/post completion-handler
# methods; `UNNotificationContent` + `UNNotificationTrigger` are BOTH required
# by `UNNotificationRequest::requestWithIdentifier_content_trigger` even though
# we pass `None` for the trigger.
objc2-user-notifications = { version = "0.3.2", default-features = false, features = [
    "UNUserNotificationCenter",
    "UNNotificationRequest",
    "UNNotificationContent",
    "UNNotificationTrigger",
    "UNNotificationSound",
    "block2",
] }
# GAP-7.8 screenshot: NSImage PNG → base64 data URL。
base64 = "0.22"

[target.'cfg(not(target_os = "macos"))'.dependencies]
xdg = "3.0.0"
