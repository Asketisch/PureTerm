[package]
name = "pureterm"
version = "0.1.0"
edition = "2021"
description = "PureTerm - Alacritty-based terminal emulator"

[features]
# GAP-7.10: MCP stdio server (`pureterm mcp serve`). Default-on so the shipped
# binary exposes the terminal surface to AI agents out of the box; build with
# `--no-default-features` to drop rmcp and the tokio runtime bits.
default = ["mcp-server"]
mcp-server = [
    "dep:rmcp",
    "dep:rmcp-macros",
    "tokio/io-std",
    "tokio/rt",
    "tokio/rt-multi-thread",
]

[dependencies]
pureterm-alacritty-runtime = { workspace = true }
pureterm-settings = { path = "../pureterm-settings" }
pureterm-jsonrpc = { workspace = true }
pureterm-daemon = { path = "../pureterm-daemon" }
pureterm-ssh = { workspace = true }
alacritty_terminal = { path = "../alacritty_terminal" }
dirs = "6.0.0"
iced = { version = "0.14", features = ["advanced", "canvas", "tokio"] }
# GAP-7.1: agent-hook matcher / deny_pattern regex evaluation.
regex = "1"
iced_wgpu = "0.14"
wgpu = { version = "27", features = ["webgpu"] }
bytemuck = { version = "1", features = ["derive"] }
crossbeam-channel = "0.5"
crossfont = "0.8.1"
notify = "8.0.0"
tokio = { version = "1", features = ["sync", "time", "net", "io-util"] }
env_logger = "0.11"
log = "0.4"
parking_lot = "0.12"
arboard = "3"

# SSH backend dependencies (Unix-only child side; AES/Argon2/serde cross-platform)
alacritty_config_derive = { path = "../alacritty_config_derive" }
alacritty_config = { path = "../alacritty_config" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# GAP-6.2: structured CLI command groups (clap derive, mirroring pureterm-settings).
clap = { version = "4", features = ["derive"] }
toml = "0.9"
# PureTerm: format-preserving TOML writer; the main process now reuses
# `pureterm_settings::config_io::mutate_config` to persist SSH profiles
# through `toml_edit` instead of a string state machine. Direct
# `toml_edit::{Item, Table, ArrayOfTables}` references in iced_app.rs
# need this dep listed here, not transitively.
toml_edit = "0.22"
nucleo-matcher = "0.3"
# GAP-7.2: agent adapter installer — locked read-modify-write of
# ~/.claude/settings.json (fs2 advisory lock + atomic NamedTempFile::persist).
fs2 = "0.4"
tempfile = "3"
# GAP-3.5/5.2/7.8: WebView embed + per-view SOCKS5 proxy. `mac-proxy` enables
# `WebViewBuilder::with_proxy_config` (Network framework SOCKS5; macOS 14+),
# the Phase C R8 mechanism that binds a web pane to an SSH tunnel. The feature
# compiles to nothing on non-macOS, so enabling it unconditionally is safe.
wry = { version = "0.55.1", features = ["mac-proxy"] }
raw-window-handle = "0.6.2"
# GAP-7.10: MCP stdio server. Optional + feature-gated (`mcp-server`). `server`
# pulls the handler + `#[tool]` macros (macros is on by default); `transport-io`
# brings the stdio transport adapter (`ServiceExt::serve(stdin, stdout)`) and,
# transitively, schemars for tool-param schemas. Pinned exactly to 1.7.0 — the
# macro API (`#[tool_router]` / `#[tool_handler]`, `Parameters<T>`) was verified
# against this release and the plan flags upstream macro drift as a risk.
rmcp = { version = "=1.7.0", optional = true, features = ["server", "transport-io", "schemars"] }
# Pin the proc-macro crate to the exact matching release: rmcp 1.7.0 only
# requires `rmcp-macros ^1.7.0`, so the resolver picks the latest (1.8.0) whose
# `#[tool]` expansion emits symbols (`schema_for_input`) absent from the 1.7.0
# runtime. Declaring the exact match here steers the whole graph to 1.7.0.
rmcp-macros = { version = "=1.7.0", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
polling = "3"
signal-hook = "0.3"
aes-gcm = "0.10"
argon2 = "0.5"
zeroize = { version = "1", features = ["zeroize_derive"] }
rand = "0.8"
rustix-openpty = "0.2"
# GAP-7.7: HMAC-SHA256 signed approval tokens for custom resume bindings.
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.1"
# PureTerm: screen eyedropper (NSColorSampler) 需要 block2 (0.6，与 objc2-app-kit 0.3.2 一致) 做 ObjC block。
block2 = "0.6"
objc2-foundation = { version = "0.3.1", default-features = false, features = ["std", "NSArray", "NSString"] }
objc2-app-kit = { version = "0.3.1", default-features = false, features = [
    "std", "NSApplication", "NSResponder", "NSView", "NSWindow", "NSMenu", "NSMenuItem",
    "objc2-quartz-core",
    # PureTerm: 屏幕吸管 NSColorSampler + sRGB 分量读取。
    "NSColorSampler", "NSColor", "NSColorSpace", "block2", "objc2-core-foundation",
] }
objc2-quartz-core = { version = "0.3.1", default-features = false, features = [
    "std", "CALayer", "CAMetalLayer", "objc2-metal",
] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
xdg = "3.0.0"
