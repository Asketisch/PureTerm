[package]
name = "pureterm"
version = "0.1.0"
edition = "2021"
description = "PureTerm - Alacritty-based terminal emulator"

[features]
# GAP-7.10:MCP stdio 服务器(`pureterm mcp serve`)。默认开启,使发布的
# 二进制开箱即向 AI 智能体暴露终端能力;用
# `--no-default-features` 构建可去掉 rmcp 与 tokio 运行时部分。
default = ["mcp-server"]
mcp-server = [
    "dep:rmcp",
    "dep:rmcp-macros",
    "tokio/io-std",
    "tokio/rt",
    "tokio/rt-multi-thread",
]
# T-core-plugin-runtime v3:真实 wasmtime 链接。默认关闭 —
# wasmtime + wasmtime-component-model 会给冷构建增加 50+ MB,
# 而常见的"构建 & 运行"循环并不需要。用
# `--features wasm-runtime` 启用。禁用时 `WasmPluginLoader::load`
# 返回 `Err("wasm-runtime feature not enabled")`,GUI 可
# 优雅降级(符合清单中的 `Err(Unsupported)`
# 回退契约)。
wasm-runtime = ["dep:wasmtime"]

[dependencies]
pureterm-alacritty-runtime = { workspace = true }
pureterm-settings = { path = "../pureterm-settings" }
pureterm-jsonrpc = { workspace = true }
pureterm-daemon = { path = "../pureterm-daemon" }
pureterm-ssh = { workspace = true }
pureterm-codeindex = { workspace = true }
pureterm-lsp = { workspace = true }
pureterm-computer-use = { workspace = true }
alacritty_terminal = { path = "../alacritty_terminal" }
# 密码学 / 编码 crate —— 纯 Rust 实现, 跨平台可用。此前误放在
# [target.'cfg(unix)'.dependencies] 段, 导致 resume_bindings(HMAC-SHA256
# 令牌)与 ssh::credential(加密凭据)在 Windows 上 unresolved import。
# 与 base64 同类问题(见 CHANGELOG): 依赖必须对所有 target 可见。
aes-gcm = "0.10"
argon2 = "0.5"
zeroize = { version = "1", features = ["zeroize_derive"] }
rand = "0.8"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
dirs = "6.0.0"
iced = { version = "0.14", features = ["advanced", "canvas", "tokio"] }
# GAP-7.1:agent-hook matcher / deny_pattern 正则求值。
regex = "1"
# GAP-7.8 截图:PNG 字节 → base64 data URL。`computer_use.rs` 的
# 编码是跨平台纯逻辑,依赖必须对所有 target 可见(此前误放在
# macOS-only 段,导致 Linux/Windows 上 unresolved import `base64`)。
base64 = "0.22"
iced_wgpu = "0.14"
wgpu = { version = "27", features = ["webgpu"] }
bytemuck = { version = "1", features = ["derive"] }
crossbeam-channel = "0.5"
crossfont = "0.8.1"
notify = "8.0.0"
# GAP-01 AI 对话:LLM HTTP 客户端。rustls-tls 避免在 Linux 上拉入 OpenSSL
# (保持 wry/rustls TLS 栈统一);`stream` 暴露
# `Response::bytes_stream()` 供 SSE 解码器使用。default-features=false
# 去掉 native-tls 以及不需要的 http2/macos 部分。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
# GAP-4.2:悬停预览 — 感知 gitignore 的路径元数据检查。
ignore = "0.4"
tokio = { version = "1", features = ["sync", "time", "net", "io-util", "process", "macros"] }
# GAP-24 增强状态栏:系统指标(CPU/内存/网络)、电池、
# 以及本地时间时钟格式化,供新的状态栏分段使用。
sysinfo = "0.32"
battery = "0.7"
chrono = "0.4"
env_logger = "0.11"
log = "0.4"
parking_lot = "0.12"
arboard = "3"

# SSH 后端依赖(Unix 专属子进程侧;AES/Argon2/serde 跨平台)
alacritty_config_derive = { path = "../alacritty_config_derive" }
alacritty_config = { path = "../alacritty_config" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# GAP-6.2:结构化 CLI 命令分组(clap derive,与 pureterm-settings 对齐)。
clap = { version = "4", features = ["derive"] }
toml = "0.9"
# PureTerm:保格式 TOML 写器;主进程现复用
# `pureterm_settings::config_io::mutate_config` 经 `toml_edit` 持久化 SSH 配置档,
# 取代旧的字符串状态机。iced_app.rs 对
# `toml_edit::{Item, Table, ArrayOfTables}` 的直接引用
# 要求在此直接声明该依赖,而非靠传递依赖。
toml_edit = "0.22"
unicode-bidi = "0.3"
nucleo-matcher = "0.3"
# GAP-54:终端背景图解码(PNG/JPG)→ GPU 纹理用的 RGBA 字节。
# 仅默认 feature(不含 webp/heif)— 保持依赖面小。
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# GAP-01 AI 对话:流式助手回复的 Markdown → 文本 span。核心
# 仅解析器(无 HTML 渲染 feature)— 面板把 span 映射为 iced 富
# 文本;语法高亮(syntect)延后。
pulldown-cmark = { version = "0.12", default-features = false }
# GAP-7.2:智能体适配器安装器 — 对
# ~/.claude/settings.json 的加锁读-改-写(fs2 咨询锁 + 原子 NamedTempFile::persist)。
fs2 = "0.4"
tempfile = "3"
# GAP-3.5/5.2/7.8:WebView 嵌入 + 每视图 SOCKS5 代理。`mac-proxy` 启用
# `WebViewBuilder::with_proxy_config`(即 Network framework 的 SOCKS5;macOS 14+),
# 即把 web 窗格绑定到 SSH 隧道的 Phase C R8 机制。该 feature
# 在非 macOS 上编译为空,无条件启用是安全的。
# PureTerm:mac-proxy 当前*停用*——它强引用 macOS 14+ 才存在的
# Network framework 符号(nw_proxy_config_create_*),在 macOS ≤13
# 的构建机上链接必然失败(undefined symbols),使整个应用无法
# 构建。调用处(browser/context.rs)已按 feature 门控:停用期间
# web 窗格仍可嵌入浏览,只是不绑定 SSH SOCKS5 代理。需要在
# macOS 14+ SDK 构建时恢复此 feature 即可。
wry = { version = "0.55.1" }
raw-window-handle = "0.6.2"
# GAP-7.10:MCP stdio 服务器。可选 + feature 门控(`mcp-server`)。`server`
# 拉入 handler + `#[tool]` 宏(macros 默认开启);`transport-io`
# 带来 stdio 传输适配器(`ServiceExt::serve(stdin, stdout)`),并
# 传递引入 schemars 用于工具参数 schema。精确钉在 1.7.0 —
# 宏 API(`#[tool_router]` / `#[tool_handler]`、`Parameters<T>`)在该
# 版本上验证过,且计划把上游宏漂移列为风险。
rmcp = { version = "=1.7.0", optional = true, features = ["server", "transport-io", "schemars"] }
# 把 proc-macro crate 钉在精确匹配的版本:rmcp 1.7.0 仅
# 要求 `rmcp-macros ^1.7.0`,于是解析器会选最新的(1.8.0),其
# `#[tool]` 展开会发出 1.7.0 运行时中
# 不存在的符号(`schema_for_input`)。在此声明精确匹配可把整张依赖图导向 1.7.0。
rmcp-macros = { version = "=1.7.0", optional = true }
# T-core-plugin-runtime v3:用于 `.wasm` 插件的 wasmtime 运行时。
# 可选 + feature 门控(`wasm-runtime`)。默认关闭 — wasmtime
# 拉入 50+ MB 原生代码 + cranelift,使冷构建
# 延长数分钟。`WasmPluginLoader` 实现编译时检查 feature 标志,
# 关闭时回退为 `Err(Unsupported)`。
wasmtime = { version = "30", optional = true, default-features = false, features = [
    "cranelift",
    "runtime",
    "component-model",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
polling = "3"
signal-hook = "0.3"
rustix-openpty = "0.2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.1"
# PureTerm: screen eyedropper (NSColorSampler) + GAP-7.8 WKWebView snapshot 都需要
# block2 (0.6，与 objc2-app-kit 0.3.2 一致) 做 ObjC block。
block2 = "0.6"
objc2-foundation = { version = "0.3.1", default-features = false, features = [
    "std", "NSArray", "NSString", "NSURL",
    # GAP-7.8 screenshot: NSData(字节读取) + NSDictionary(空 props) + NSError(错误文案)。
    "NSData", "NSDictionary", "NSError",
] }
objc2-app-kit = { version = "0.3.1", default-features = false, features = [
    "std", "NSApplication", "NSResponder", "NSView", "NSWindow", "NSMenu", "NSMenuItem",
    "NSVisualEffectView",
    "NSHapticFeedback",
    "objc2-quartz-core",
    # PureTerm: 屏幕吸管 NSColorSampler + sRGB 分量读取。
    "NSColorSampler", "NSColor", "NSColorSpace", "block2", "objc2-core-foundation",
    # GAP-7.8 screenshot: NSImage(TIFFRepresentation) + NSBitmapImageRep(PNG 编码);
    # NSBitmapImageRep 结构体的 re-export 额外要求 NSImageRep feature。
    "NSImage", "NSBitmapImageRep", "NSImageRep",
    # GAP-09:Dock 角标 — NSApplication::dockTile() → NSDockTile::setBadgeLabel。
    "NSDockTile",
    # GAP-61:打印 — NSPrintOperation.pdfOperationWithView + runOperation 模态
    # 对话框;NSPrintInfo 驱动页面矩形;view lockFocus() 需要 NSGraphicsContext。
    # NSStringDrawing 用于把等宽文本行画进
    # 将成为打印作业内容的离屏 view。
    "NSPrintOperation", "NSPrintInfo", "NSPrintPanel",
    "NSGraphicsContext", "NSStringDrawing",
    # GAP-4.6:VoiceOver 播报,经 NSAccessibilityPostNotification /
    # NSAccessibilityPostNotificationWithUserInfo(用于发送
    # 带 NSAccessibilityAnnouncementKey 的 AnnouncementRequestedNotification)。
    "NSAccessibilityConstants",
] }
objc2-quartz-core = { version = "0.3.1", default-features = false, features = [
    "std", "CALayer", "CAMetalLayer", "objc2-metal",
] }
# GAP-7.8: 原生 WKWebView 快照。wry 0.55.1 的 `WryWebView` 是 `WKWebView` 子类,
# 经 `WebViewExtMacOS::webview()` 拿到 `Retained<WryWebView>` 后调
# `takeSnapshotWithConfiguration:completionHandler:` 做快照(替代之前 "wry 未暴露"
# 的 stub)。WKWebView 传递启用 objc2-foundation 的 NSData/NSDictionary/NSError/
# objc2-core-foundation;WKSnapshotConfiguration+block2 解锁 takeSnapshot 方法;
# objc2-app-kit 让 completion block 能引用 NSImage。
objc2-web-kit = { version = "0.3.2", default-features = false, features = [
    "std", "WKWebView", "WKSnapshotConfiguration", "block2", "objc2-app-kit",
] }
# GAP-09:macOS 桌面通知 — 为 OSC 9/99/777 + 响铃 + `pureterm notify`
# 提供 UNUserNotificationCenter 吐司。精确钉在 0.3.x(*不是* 0.2.x),因为
# 0.2.x 绑定 objc2 0.5 / objc2-foundation 0.2,其 `NSString`/`Retained`
# 与本 crate 的 objc2 0.6 / objc2-foundation 0.3 系是*不同类型*
# (wry 传递拉入 0.2.2;我们有意把 0.3 系作为直接
# 依赖加入以统一类型)。`block2` 解锁 request/post 完成处理器
# 方法;`UNNotificationContent` + `UNNotificationTrigger` 两者都是
# `UNNotificationRequest::requestWithIdentifier_content_trigger` 所必需,
# 即使 trigger 传的是 `None`。
objc2-user-notifications = { version = "0.3.2", default-features = false, features = [
    "UNUserNotificationCenter",
    "UNNotificationRequest",
    "UNNotificationContent",
    "UNNotificationTrigger",
    "UNNotificationSound",
    "block2",
] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
xdg = "3.0.0"
