[package]
name = "pureterm"
version = "0.1.0"
edition = "2021"
description = "PureTerm - A pure Rust terminal emulator"

[dependencies]
pureterm-core = { workspace = true }
pureterm-terminal = { workspace = true }
pureterm-session = { workspace = true }
pureterm-ui = { workspace = true }
pureterm-gui = { workspace = true }

winit = { workspace = true }
wgpu = { workspace = true }
egui = { workspace = true }
egui-wgpu = { workspace = true }
egui-winit = { workspace = true }
tokio = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }
anyhow = { workspace = true }
arboard = { workspace = true }
pollster = "0.4"
clap = { version = "4", features = ["derive"] }
uuid = { workspace = true }
serde_json = { workspace = true }
sentry = { version = "0.32", features = ["panic", "backtrace"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-app-kit = { workspace = true }
objc2-foundation = { workspace = true }
raw-window-handle = { workspace = true }
