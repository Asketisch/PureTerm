[workspace]
resolver = "2"
members = [
    "crates/pureterm",
    "crates/pureterm-alacritty-runtime",
    "crates/alacritty_terminal",
    "crates/alacritty_config",
    "crates/alacritty_config_derive",
]

[workspace.dependencies]
pureterm-alacritty-runtime = { path = "crates/pureterm-alacritty-runtime" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
