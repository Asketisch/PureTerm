[workspace]
resolver = "2"
members = [
    "crates/pureterm",
    "crates/pureterm-alacritty-runtime",
    "crates/pureterm-settings",
    "crates/alacritty_terminal",
    "crates/alacritty_config",
    "crates/alacritty_config_derive",
    "crates/pureterm-jsonrpc",
    "crates/pureterm-daemon",
    "crates/pureterm-ssh",
    "crates/pureterm-codeindex",
    "crates/pureterm-lsp",
    "crates/pureterm-computer-use",
]

[workspace.dependencies]
pureterm-alacritty-runtime = { path = "crates/pureterm-alacritty-runtime" }
pureterm-jsonrpc = { path = "crates/pureterm-jsonrpc" }
pureterm-ssh = { path = "crates/pureterm-ssh" }
pureterm-codeindex = { path = "crates/pureterm-codeindex" }
pureterm-lsp = { path = "crates/pureterm-lsp" }
pureterm-computer-use = { path = "crates/pureterm-computer-use" }

# ── Dev profile:优化以加快增量编译 ───────────────────
# Dev profile:opt-level=0 + 仅行号的调试信息 + 高 codegen-units
# → 单 crate 最快的迭代速度。Test profile(下方)复用
# 同一套 `debug=1` + `codegen-units=256` 配方,使测试编译保持
# 接近 dev 构建速度。
[profile.dev]
incremental = true
split-debuginfo = "unpacked"   # macOS: avoid repacking DWARF on every incremental build
debug = 1                       # line-number info only — ~20-30% less debug-info generation time
codegen-units = 256             # higher parallelism during compilation

# ── Release profile:thin LTO + 符号剥离 ────────────────────────────────
# 从全量 LTO(`lto = true`)改为 thin LTO + `strip = "symbols"`
# 大幅缩短 release 链接时间,同时使二进制体积
# 与全量 LTO 构建的差距保持在 ~5% 以内。需要旧行为时按构建覆盖:
# 用 `--config 'profile.release.lto=true'` 覆盖即可。
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

# ── Release-fast profile:利于迭代的 release 构建 ──────────────────
# 想要 release 级优化代码生成、又不想付 LTO 代价时使用。
# `cargo build --profile release-fast --bin pureterm` 保持 `incremental = true`,
# 后续重建只需重新链接改动的 crate。
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
opt-level = 2
incremental = true

# ── Test profile:与 dev 同速,无完整调试信息 ───────────────────
# `debug = 1` 保留行号,但从 panic
# 回溯中去掉变量名 — 全工作区节省 ~20-30% 调试信息生成时间
# (pureterm 一个 crate 就有 958 个 #[test],影响显著)。
# `codegen-units = 256` 与 dev profile 一致,最大化并行代码生成。
# 用 `cargo test --profile test` 显式触发;默认的
# `cargo test` 调用也会选中该 profile。
[profile.test]
debug = 1
codegen-units = 256
