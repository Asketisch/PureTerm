[workspace]
resolver = "2"
members = [
    "crates/pureterm",
    "crates/pureterm-core",
    "crates/pureterm-terminal",
    "crates/pureterm-session",
    "crates/pureterm-ui",
    "crates/pureterm-gui",
]

[workspace.dependencies]
# Async
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# Terminal parsing
vte = "0.15"
unicode-width = "0.1"
unicode-segmentation = "1.11"

# SSH
russh = "0.60"

# Serial
serialport = "4.6"

# Local PTY
portable-pty = "0.8"

# UI - egui
egui = "0.34"
epaint = "0.34"
egui-wgpu = "0.34"
egui-winit = "0.34"

# GPU Rendering
wgpu = "24"
winit = "0.30"

# Fonts
fontdue = "0.9"

# Config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
dirs = "5.0"

# Utils
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2.0"
anyhow = "1.0"
log = { version = "0.4", features = ["release_max_level_warn"] }
env_logger = "0.11"
parking_lot = "0.12"
once_cell = "1.20"
regex = "1.11"
rpassword = "7"

# Testing
tempfile = "3"

# Crypto
sha2 = "0.10"
aes-gcm = "0.10"
base64 = "0.22"
ed25519-dalek = "2.1"
rsa = "0.9"

# Workspace crates
pureterm-core = { path = "crates/pureterm-core" }
pureterm-terminal = { path = "crates/pureterm-terminal" }
pureterm-session = { path = "crates/pureterm-session" }
pureterm-ui = { path = "crates/pureterm-ui" }
pureterm-gui = { path = "crates/pureterm-gui" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
