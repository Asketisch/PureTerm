# PureTerm agent-triage 键位方案
# 面向多窗格 AI 智能体工作流优化。
# 用法:pureterm shortcuts preset agent-triage
#
# 设计目标:
#   - 快速切换标签(⌘1-9,⌘⇧] / [)
#   - 快速分屏/放大,以便智能体 + 输出并排
#   - 交换窗格以重排智能体布局
#   - 保留全部默认;仅文档化新增项。

# ── 核心(与默认相同) ─────────────────────────────────────────────

[[keyboard.bindings]]
key = "t"
mods = "Command"
action = "NewTab"

[[keyboard.bindings]]
key = "w"
mods = "Command"
action = "ClosePane"

[[keyboard.bindings]]
key = "d"
mods = "Command"
action = "SplitHorizontal"

[[keyboard.bindings]]
key = "D"
mods = "Command"
action = "SplitVertical"

[[keyboard.bindings]]
key = "="
mods = "Command"
action = "EqualizeSplits"

[[keyboard.bindings]]
key = "X"
mods = "Command"
action = "SwapPane"

[[keyboard.bindings]]
key = "Enter"
mods = "Command|Shift"
action = "ToggleZoom"

[[keyboard.bindings]]
key = "]"
mods = "Command"
action = "FocusPaneNext"

[[keyboard.bindings]]
key = "["
mods = "Command"
action = "FocusPanePrev"

[[keyboard.bindings]]
key = "v"
mods = "Command"
action = "Paste"

[[keyboard.bindings]]
key = "c"
mods = "Command"
action = "Copy"

[[keyboard.bindings]]
key = "S"
mods = "Command"
action = "OpenSshDialog"

[[keyboard.bindings]]
key = "P"
mods = "Command"
action = "OpenCommandPalette"

# ── agent-triage 专属 ─────────────────────────────────────────────
# 把窗格移到新标签,快速隔离智能体
[[keyboard.bindings]]
key = "T"
mods = "Command|Shift"
action = "MovePaneToNewTab"

# 把窗格移到新窗口,跨显示器监控智能体
[[keyboard.bindings]]
key = "N"
mods = "Command|Shift"
action = "MovePaneToNewWindow"
