# PureTerm tmux 风格键位方案
# Ctrl+B 前缀和弦,用于窗格/窗口管理。
# 用法:pureterm shortcuts preset tmux
#
# 注意:和弦支持在 Phase 6(GAP-3.7)。在那之前,本预设
# 用 Cmd 系绑定做近似替代。

# ── 标签 = tmux window ──────────────────────────────────────────────────

[[keyboard.bindings]]
key = "t"
mods = "Command"
action = "NewTab"

[[keyboard.bindings]]
key = "w"
mods = "Command"
action = "ClosePane"

[[keyboard.bindings]]
key = "}"
mods = "Command"
action = "NextTab"

[[keyboard.bindings]]
key = "{"
mods = "Command"
action = "PrevTab"

# ── 分屏 ─────────────────────────────────────────────────────────

[[keyboard.bindings]]
key = "d"
mods = "Command"
action = "SplitHorizontal"

[[keyboard.bindings]]
key = "D"
mods = "Command"
action = "SplitVertical"

[[keyboard.bindings]]
key = "="
mods = "Command"
action = "EqualizeSplits"

[[keyboard.bindings]]
key = "X"
mods = "Command"
action = "SwapPane"

[[keyboard.bindings]]
key = "Enter"
mods = "Command|Shift"
action = "ToggleZoom"

# ── tmux 风格:Cmd+方向键切换窗格 ─────────────────────────────────

[[keyboard.bindings]]
key = "ArrowUp"
mods = "Command"
action = "FocusPanePrev"

[[keyboard.bindings]]
key = "ArrowDown"
mods = "Command"
action = "FocusPaneNext"

[[keyboard.bindings]]
key = "ArrowLeft"
mods = "Command"
action = "FocusPanePrev"

[[keyboard.bindings]]
key = "ArrowRight"
mods = "Command"
action = "FocusPaneNext"

# ── 剪贴板 ──────────────────────────────────────────────────────────

[[keyboard.bindings]]
key = "v"
mods = "Command"
action = "Paste"

[[keyboard.bindings]]
key = "c"
mods = "Command"
action = "Copy"

# ── 对话框 ────────────────────────────────────────────────────────────

[[keyboard.bindings]]
key = "S"
mods = "Command"
action = "OpenSshDialog"

[[keyboard.bindings]]
key = "P"
mods = "Command"
action = "OpenCommandPalette"
