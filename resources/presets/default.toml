# PureTerm default keymap
# This file documents the hardcoded defaults. Placing it in your config
# as [[keyboard.bindings]] has no effect (defaults are always loaded first).
# Override any binding by re-declaring it with a different action.

[[keyboard.bindings]]
key = "T"
mods = "Command|Shift"
action = "MovePaneToNewTab"

[[keyboard.bindings]]
key = "t"
mods = "Command"
action = "NewTab"

[[keyboard.bindings]]
key = "w"
mods = "Command"
action = "ClosePane"

[[keyboard.bindings]]
key = "}"
mods = "Command"
action = "NextTab"

[[keyboard.bindings]]
key = "{"
mods = "Command"
action = "PrevTab"

[[keyboard.bindings]]
key = "]"
mods = "Command"
action = "FocusPaneNext"

[[keyboard.bindings]]
key = "["
mods = "Command"
action = "FocusPanePrev"

[[keyboard.bindings]]
key = "d"
mods = "Command"
action = "SplitHorizontal"

[[keyboard.bindings]]
key = "D"
mods = "Command"
action = "SplitVertical"

[[keyboard.bindings]]
key = "="
mods = "Command"
action = "EqualizeSplits"

[[keyboard.bindings]]
key = "X"
mods = "Command"
action = "SwapPane"

[[keyboard.bindings]]
key = "Enter"
mods = "Command|Shift"
action = "ToggleZoom"

[[keyboard.bindings]]
key = "N"
mods = "Command|Shift"
action = "MovePaneToNewWindow"

[[keyboard.bindings]]
key = "v"
mods = "Command"
action = "Paste"

[[keyboard.bindings]]
key = "c"
mods = "Command"
action = "Copy"

[[keyboard.bindings]]
key = "a"
mods = "Command"
action = "SelectAll"

[[keyboard.bindings]]
key = "S"
mods = "Command"
action = "OpenSshDialog"

[[keyboard.bindings]]
key = "P"
mods = "Command"
action = "OpenCommandPalette"

# Search (GAP-3.8 / GAP-4.3)
[[keyboard.bindings]]
key = "f"
mods = "Command"
action = "SearchForward"

[[keyboard.bindings]]
key = "F"
mods = "Command|Shift"
action = "SearchInDirectory"

[[keyboard.bindings]]
key = "F3"
action = "SearchNext"

[[keyboard.bindings]]
key = "F3"
mods = "Shift"
action = "SearchPrev"

[[keyboard.bindings]]
key = "g"
mods = "Command"
action = "SearchNext"

[[keyboard.bindings]]
key = "g"
mods = "Command|Shift"
action = "SearchPrev"
