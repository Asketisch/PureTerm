# PureTerm macOS 经典键位方案
# 对齐 macOS 终端常见默认,便于从 macOS 终端迁移的用户。
# 用法:pureterm shortcuts preset macos

[[keyboard.bindings]]
key = "t"
mods = "Command"
action = "NewTab"

[[keyboard.bindings]]
key = "w"
mods = "Command"
action = "ClosePane"

[[keyboard.bindings]]
key = "}"
mods = "Command"
action = "NextTab"

[[keyboard.bindings]]
key = "{"
mods = "Command"
action = "PrevTab"

[[keyboard.bindings]]
key = "d"
mods = "Command"
action = "SplitHorizontal"

[[keyboard.bindings]]
key = "D"
mods = "Command"
action = "SplitVertical"

[[keyboard.bindings]]
key = "="
mods = "Command"
action = "EqualizeSplits"

[[keyboard.bindings]]
key = "Enter"
mods = "Command|Shift"
action = "ToggleZoom"

# macOS:⌘] / ⌘[ 切换窗格焦点
[[keyboard.bindings]]
key = "]"
mods = "Command"
action = "FocusPaneNext"

[[keyboard.bindings]]
key = "["
mods = "Command"
action = "FocusPanePrev"

# macOS:⌘⇧Enter 最大化窗格
[[keyboard.bindings]]
key = "Enter"
mods = "Command|Shift"
action = "ToggleZoom"

[[keyboard.bindings]]
key = "v"
mods = "Command"
action = "Paste"

[[keyboard.bindings]]
key = "c"
mods = "Command"
action = "Copy"

[[keyboard.bindings]]
key = "a"
mods = "Command"
action = "SelectAll"

[[keyboard.bindings]]
key = "S"
mods = "Command"
action = "OpenSshDialog"

[[keyboard.bindings]]
key = "P"
mods = "Command"
action = "OpenCommandPalette"

# macOS:⌘⇧N 新窗口(映射到 MovePaneToNewWindow)
[[keyboard.bindings]]
key = "N"
mods = "Command|Shift"
action = "MovePaneToNewWindow"
