# PureTerm vim 风格键位方案
# 用 hjkl 导航窗格,外加标准 macOS 标签/窗口绑定。
# 用法:pureterm shortcuts preset vim

# ── 标签管理(与默认相同) ────────────────────────────

[[keyboard.bindings]]
key = "t"
mods = "Command"
action = "NewTab"

[[keyboard.bindings]]
key = "w"
mods = "Command"
action = "ClosePane"

[[keyboard.bindings]]
key = "}"
mods = "Command"
action = "NextTab"

[[keyboard.bindings]]
key = "{"
mods = "Command"
action = "PrevTab"

# ── 分屏(与默认相同) ─────────────────────────────────────────────

[[keyboard.bindings]]
key = "d"
mods = "Command"
action = "SplitHorizontal"

[[keyboard.bindings]]
key = "D"
mods = "Command"
action = "SplitVertical"

[[keyboard.bindings]]
key = "="
mods = "Command"
action = "EqualizeSplits"

[[keyboard.bindings]]
key = "X"
mods = "Command"
action = "SwapPane"

[[keyboard.bindings]]
key = "Enter"
mods = "Command|Shift"
action = "ToggleZoom"

# ── 剪贴板(与默认相同) ──────────────────────────────────────────────

[[keyboard.bindings]]
key = "v"
mods = "Command"
action = "Paste"

[[keyboard.bindings]]
key = "c"
mods = "Command"
action = "Copy"

# ── vim 风格窗格导航 ──────────────────────────────────────────
# ⌘+h/j/k/l 导航窗格(相邻优先,非 DFS 顺序)

[[keyboard.bindings]]
key = "h"
mods = "Command"
action = "FocusPanePrev"

[[keyboard.bindings]]
key = "l"
mods = "Command"
action = "FocusPaneNext"

[[keyboard.bindings]]
key = "j"
mods = "Command"
action = "FocusPanePrev"

[[keyboard.bindings]]
key = "k"
mods = "Command"
action = "FocusPaneNext"

# ── 对话框 ────────────────────────────────────────────────────────────

[[keyboard.bindings]]
key = "S"
mods = "Command"
action = "OpenSshDialog"

[[keyboard.bindings]]
key = "P"
mods = "Command"
action = "OpenCommandPalette"
