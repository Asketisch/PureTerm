# PureTerm VS Code 终端兼容键位方案
# 对齐 VS Code 集成终端的快捷键。
# 用法:pureterm shortcuts preset vscode

[[keyboard.bindings]]
key = "t"
mods = "Command"
action = "NewTab"

[[keyboard.bindings]]
key = "w"
mods = "Command"
action = "ClosePane"

[[keyboard.bindings]]
key = "}"
mods = "Command"
action = "NextTab"

[[keyboard.bindings]]
key = "{"
mods = "Command"
action = "PrevTab"

# VS Code:⌘\ 分屏终端
[[keyboard.bindings]]
key = "\\"
mods = "Command"
action = "SplitHorizontal"

[[keyboard.bindings]]
key = "="
mods = "Command"
action = "EqualizeSplits"

[[keyboard.bindings]]
key = "Enter"
mods = "Command|Shift"
action = "ToggleZoom"

# VS Code:⌘⌥ 方向键聚焦窗格
# (默认已含,经 Cmd+Option+Arrow → PaneFocusAdjacent)

[[keyboard.bindings]]
key = "v"
mods = "Command"
action = "Paste"

[[keyboard.bindings]]
key = "c"
mods = "Command"
action = "Copy"

[[keyboard.bindings]]
key = "S"
mods = "Command"
action = "OpenSshDialog"

[[keyboard.bindings]]
key = "P"
mods = "Command"
action = "OpenCommandPalette"
