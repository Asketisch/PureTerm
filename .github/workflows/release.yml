name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build universal binary
        run: |
          cargo build --release --target aarch64-apple-darkin
          cargo build --release --target x86_64-apple-darwin
          lipo -create -output target/pureterm \
            target/aarch64-apple-darwin/release/pureterm \
            target/x86_64-apple-darwin/release/pureterm
      - uses: actions/upload-artifact@v4
        with:
          name: pureterm-macos
          path: target/pureterm

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: pureterm-linux
          path: target/release/pureterm

  release:
    needs: [build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/pureterm-macos/pureterm
            artifacts/pureterm-linux/pureterm
