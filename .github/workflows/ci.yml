# PureTerm CI — 三平台构建 + 测试矩阵。
#
# T-core-windows-conpty v3(清单 E.6):新增 `windows-2022`
# runner,与现有 macOS + Linux runner 并列。矩阵
# 覆盖:
#   - ubuntu-22.04  (x86_64-unknown-linux-gnu)
#   - macos-14      (aarch64-apple-darwin, M1)
#   - windows-2022  (x86_64-pc-windows-msvc)
#
# 每个 runner 对全工作区执行 `cargo build` + `cargo test`。
# Windows 专属测试(`conpty_smoke.rs`、`windows.rs`)经
# `#[cfg(windows)]` 门控,在其他 runner 上为空操作。
#
# 矩阵默认用 `fast` profile(无 LTO)以加快反馈;
# release 构建不在本工作流范围(用独立工作流)。
#
# 为什么用三个 runner 而非一个:PureTerm 链接的是
# 平台专属后端(Unix 上 rustix-openpty、
# Windows 上 ConPTY、macOS 上 objc2)— cfg 门控代码
# 中的类型错误在单一平台上不会暴露。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # 跨运行保持 sccache 缓存温热(降低已缓存
  # 依赖的构建时间;Rust 工具链经
  # `actions-rust-lang/setup-rust-toolchain` 单独缓存)。
  SCCACHE_DIR: ${{ github.workspace }}/.sccache

jobs:
  build-test:
    name: Build + Test (${{ matrix.os }} / ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfreetype6-dev libfontconfig1-dev \
            libssl-dev pkg-config \
            cmux imagemagick

      - name: Cache cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          target-dir: target
          key: ${{ matrix.os }}-${{ matrix.target }}

      - name: Build (debug)
        run: cargo build --workspace --target ${{ matrix.target }}

      - name: Test
        # 运行全部单元 + 集成测试。`#[ignore]` 的 E2E 测试
        # (graphics/tmux-cc/shell-integ/conpty-smoke)保持跳过 —
        # 它们需要 CI runner 不提供的
        # 外部二进制或显示面。
        run: cargo test --workspace --target ${{ matrix.target }} --no-fail-fast

  clippy:
    name: Clippy (linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfreetype6-dev libfontconfig1-dev libssl-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings