# PureTerm CI — 三平台构建 + 测试矩阵。
#
# 为什么是三个 runner:PureTerm 链接平台专属后端
# (Unix rustix-openpty / Windows ConPTY / macOS objc2),
# cfg 门控代码里的类型错误在单一平台上不会暴露。
#
# 工具链由 rust-toolchain.toml 钉住 (1.93);不传 toolchain 让
# setup-rust-toolchain 读取该文件。缓存由该 action 内建的
# Swatinem/rust-cache 提供(cache-key 按矩阵项区分),不再重复声明。
#
# lint 门禁说明(重要):
# 旧版本全局设 RUSTFLAGS=-D warnings,但仓库当前有
#   - 500+ 条 clippy 债(集中在 pureterm / pureterm-settings /
#     pureterm-daemon);
#   - 170+ 处 #[cfg(test)] 辅助类型的 rustc dead_code;
# 且 vendored 的 alacritty_* 按维护规则不做无关改动。
# 在积压清零前 -D warnings 会让 CI 永远红,故本工作流只保证
# "能编译 / 能测试 / 能链接",clippy 另设 advisory job 报告。
# 待 lint 债清零后可恢复 -D warnings。
#
# .cargo/config.toml 给 Linux target 硬编码了 -fuse-ld=mold,
# 而 GitHub runner 只有 lld。用环境变量 RUSTFLAGS 覆盖
# target.*.rustflags(Cargo 中环境变量优先级更高),否则 Linux
# 链接期会找不到 mold。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一 workflow + 同一 ref 只保留一个在跑的 run,新触发的排队,
# 且绝不取消在跑的 run —— 避免连续 push / dispatch 时重复占用
# runner(尤其是数量有限的 macOS job)。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: Build + Test (${{ matrix.os }} / ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      # 不传 toolchain → 读取 rust-toolchain.toml 钉住的版本。
      # 不用 dtolnay/rust-toolchain@stable:它经 RUSTUP_TOOLCHAIN
      # 覆盖 rust-toolchain.toml,CI 会跑在最新 stable 上,
      # 与本地钉住的 1.93 脱节。
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          cache-key: ${{ matrix.os }}-${{ matrix.target }}
          # 不用 action 默认的 -D warnings(见文件头说明)。
          rustflags: ""

      # apt-get 在 GitHub runner 上会偶发"下载期硬挂",两次实证:
      #   - CI run 42240085099(Clippy job)
      #   - Release run 42243444351(ubuntu-22.04 target)
      # 日志证据(42243444351):apt-get update 16s 内正常抓完 30MB;
      # apt-get install 逐包下载到 Get:49(速率从 1s/包劣化到 5s/包)
      # 后,某个连接的 TCP 建连卡在 SYN 阶段 —— apt 自带的 http 超时
      # 只覆盖读超时、管不到建连,于是既不报错也不退出,静默挂死
      # (实测 20 分钟被外层 timeout 以 exit 124 杀掉)。
      # 护栏(逐层收敛):
      #   1. Acquire::http/https::Timeout=120 — 单个请求 120s 无响应
      #      就放弃(覆盖读;建连由第 5 条兜底);
      #   2. Acquire::Retries=3 — 瞬时抖动自动重试而不是直接失败;
      #   3. Acquire::ForceIPv4=true — 排除 IPv6 黑洞这一类;
      #   4. Acquire::http::Pipeline-Depth=0 — 关掉 HTTP pipelining
      #      (个别边缘节点上 pipeline 会僵死,且卡住会影响整批);
      #   5. 外层 timeout --kill-after=30 — 兜底:把"静默挂 6 小时"
      #      变成"有界失败"(实测 exit 124,该层护栏本身有效);
      #   6. 整步重试 3 轮 — 有界失败不直接判红,重试通常就过去了
      #      (正常耗时:update 16s + install 约 2min,单轮上限
      #      300s/900s 远大于正常值,不会误杀);
      #   7. DEBIAN_FRONTEND=noninteractive — 杜绝交互式提问卡住。
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          APT_OPTS=(
            -o Acquire::Retries=3
            -o Acquire::ForceIPv4=true
            -o Acquire::http::Timeout=120
            -o Acquire::https::Timeout=120
            -o Acquire::http::Pipeline-Depth=0
          )
          PKGS=(
            libfreetype6-dev libfontconfig1-dev
            libssl-dev pkg-config
            libgtk-3-dev libwebkit2gtk-4.1-dev lld
          )
          rc=1
          for attempt in 1 2 3; do
            echo "::group::apt attempt ${attempt}/3"
            rc=0
            sudo timeout --kill-after=30 300 apt-get "${APT_OPTS[@]}" update \
              && sudo timeout --kill-after=30 900 apt-get "${APT_OPTS[@]}" install -y "${PKGS[@]}" \
              || rc=$?
            echo "::endgroup::"
            if [[ "${rc}" -eq 0 ]]; then
              echo "apt 成功(第 ${attempt} 轮)"
              exit 0
            fi
            echo "::warning::apt 第 ${attempt} 轮失败(rc=${rc}),20s 后重试"
            sleep 20
          done
          echo "::error::apt-get 三轮重试后仍失败"
          exit 1

      # aws-lc-rs 在 MSVC 上需要 NASM 汇编 x86_64 加密原语;
      # GitHub windows runner 默认不带,缺了会以
      # "NASM command not found! Build cannot continue." panic。
      - name: Install NASM (Windows / aws-lc-rs)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm --no-progress -y
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # 只给 Linux 设置 RUSTFLAGS(覆盖 config 的 mold → lld);
      # 其余平台设空串,阻止 config 里的链接器 flag 泄漏。
      - name: Build
        env:
          RUSTFLAGS: ${{ runner.os == 'Linux' && '-C link-arg=-fuse-ld=lld' || '' }}
        run: cargo build --workspace --target ${{ matrix.target }}

      - name: Test
        # 必须显式声明 bash:Windows runner 的默认 shell 是 pwsh,
        # 而 PowerShell 里原生命令失败**不会**中止脚本 —— 第一条
        # cargo test 编译失败会被静默吞掉,第二条成功后整个 step
        # 判绿。2026-11-06 的 CI run 42243429793 就是这么"绿"的:
        # Windows job 带着 7 个编译错误、workspace 测试零执行。
        shell: bash
        env:
          RUSTFLAGS: ${{ runner.os == 'Linux' && '-C link-arg=-fuse-ld=lld' || '' }}
        # #[ignore] 的 E2E 测试(graphics/tmux-cc/shell-integ/
        # conpty-smoke)保持跳过 — 它们需要 runner 不提供的
        # 外部二进制或显示面。
        #
        # vendored 的 alacritty_terminal/tests/ref.rs 在 runner 上有
        # 8 个 debug_assert 越界失败(本地单独跑 45/45 通过),且按
        # 维护规则不改 vendored 源码,故该 crate 只跑 lib 单元测试
        # (1000+ 个),其余 11 个 crate 的所有测试照常跑。
        # 两条命令都跑完,任一失败即整个 step 失败
        # (bash -e 下 `cmd || rc=$?` 不会被提前中止)。
        run: |
          rc=0
          cargo test --workspace --exclude alacritty_terminal --target ${{ matrix.target }} --no-fail-fast || rc=$?
          cargo test -p alacritty_terminal --lib --target ${{ matrix.target }} --no-fail-fast || rc=$?
          exit $rc

  clippy:
    name: Clippy (advisory)
    runs-on: ubuntu-22.04
    env:
      # 必须是非空值。Cargo 把空字符串 RUSTFLAGS 视为「未设置」,
      # 于是 .cargo/config.toml 的 target.*.rustflags
      # (-fuse-ld=mold) 会照常生效,而 runner 没有 mold →
      # 链接 build script 时 "cannot find 'ld'"。用显式的 lld
      # 覆盖掉它(clippy 会编译 build script,所以真的会链接)。
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
          # 关键:别让 action 注入默认的 -D warnings,否则
          # clippy lint 被提升为 error,advisory job 永远红。
          # RUSTFLAGS 已由 job env 设定,action 不会覆盖。
          rustflags: ""
      # apt-get 在 GitHub runner 上会偶发"下载期硬挂",两次实证:
      #   - CI run 42240085099(Clippy job)
      #   - Release run 42243444351(ubuntu-22.04 target)
      # 日志证据(42243444351):apt-get update 16s 内正常抓完 30MB;
      # apt-get install 逐包下载到 Get:49(速率从 1s/包劣化到 5s/包)
      # 后,某个连接的 TCP 建连卡在 SYN 阶段 —— apt 自带的 http 超时
      # 只覆盖读超时、管不到建连,于是既不报错也不退出,静默挂死
      # (实测 20 分钟被外层 timeout 以 exit 124 杀掉)。
      # 护栏(逐层收敛):
      #   1. Acquire::http/https::Timeout=120 — 单个请求 120s 无响应
      #      就放弃(覆盖读;建连由第 5 条兜底);
      #   2. Acquire::Retries=3 — 瞬时抖动自动重试而不是直接失败;
      #   3. Acquire::ForceIPv4=true — 排除 IPv6 黑洞这一类;
      #   4. Acquire::http::Pipeline-Depth=0 — 关掉 HTTP pipelining
      #      (个别边缘节点上 pipeline 会僵死,且卡住会影响整批);
      #   5. 外层 timeout --kill-after=30 — 兜底:把"静默挂 6 小时"
      #      变成"有界失败"(实测 exit 124,该层护栏本身有效);
      #   6. 整步重试 3 轮 — 有界失败不直接判红,重试通常就过去了
      #      (正常耗时:update 16s + install 约 2min,单轮上限
      #      300s/900s 远大于正常值,不会误杀);
      #   7. DEBIAN_FRONTEND=noninteractive — 杜绝交互式提问卡住。
      - name: Install Linux system deps
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          APT_OPTS=(
            -o Acquire::Retries=3
            -o Acquire::ForceIPv4=true
            -o Acquire::http::Timeout=120
            -o Acquire::https::Timeout=120
            -o Acquire::http::Pipeline-Depth=0
          )
          PKGS=(
            libfreetype6-dev libfontconfig1-dev
            libssl-dev pkg-config
            libgtk-3-dev libwebkit2gtk-4.1-dev lld
          )
          rc=1
          for attempt in 1 2 3; do
            echo "::group::apt attempt ${attempt}/3"
            rc=0
            sudo timeout --kill-after=30 300 apt-get "${APT_OPTS[@]}" update \
              && sudo timeout --kill-after=30 900 apt-get "${APT_OPTS[@]}" install -y "${PKGS[@]}" \
              || rc=$?
            echo "::endgroup::"
            if [[ "${rc}" -eq 0 ]]; then
              echo "apt 成功(第 ${attempt} 轮)"
              exit 0
            fi
            echo "::warning::apt 第 ${attempt} 轮失败(rc=${rc}),20s 后重试"
            sleep 20
          done
          echo "::error::apt-get 三轮重试后仍失败"
          exit 1
      # 不用 --all-targets:vendored 的 alacritty_terminal 自带
      # `#![deny(clippy::all)]`,`--all-targets` 会编译它的 lib test,
      # 其中若干 `vec!` 触发 clippy::useless_vec 被硬 deny → job 失败。
      # 按维护规则不动 vendored 源码,故只检查交付代码(lib / bins)。
      - name: Clippy (report only)
        run: cargo clippy --workspace
